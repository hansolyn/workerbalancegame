<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직장인 밸런스게임</title>
<meta name="description" content="15번의 선택으로 알아보는 나의 직장인 유형. 정답은 없고, 중간도 없습니다.">
<meta property="og:title" content="직장인 밸런스게임">
<meta property="og:description" content="15번의 선택으로 알아보는 나의 직장인 유형. 정답은 없고, 중간도 없습니다.">
<meta property="og:type" content="website">
<meta property="og:image" content="/cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="960">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 폭 한 줄 컬럼. 문항은 위아래 두 장의 선택 카드와 가운데 도장, 결과는 사원증 한 장. */
:root {
  --bg: #EEF1F6;
  --card: #FFFFFF;
  --ink: #17203A;
  --muted: #5B6582;
  --line: #D5DBE8;
  --stamp: #D4372C;
  --mark: #FFD84A;
  --on-mark: #17203A;
  --cover-navy: #231A36;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1420; --card: #1A2133; --ink: #EEF1F8; --muted: #9AA4BF;
    --line: #2C3650; --stamp: #FF6A5C; --mark: #E8C23A; --on-mark: #17203A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1420; --card: #1A2133; --ink: #EEF1F8; --muted: #9AA4BF;
  --line: #2C3650; --stamp: #FF6A5C; --mark: #E8C23A; --on-mark: #17203A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  word-break: keep-all;
}
#app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--stamp); outline-offset: 3px; }

.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

/* 표지 */
.cover { display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
.cover-img { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 960; border-radius: 18px; border: 2px solid var(--cover-navy); background: #D3D1FD; }
/* 표지 이미지의 노란 타이틀(#FFD82E)과 남색 외곽선(#231A36)에 맞춘 시작 버튼 */
.start {
  background: #FFD82E; color: #231A36; border: 3px solid #231A36; border-radius: 16px;
  padding: 16px; font-size: 21px; font-weight: 800; width: 100%;
  box-shadow: 0 6px 0 #231A36; transition: transform .08s, box-shadow .08s;
}
.start:hover { background: #FFE15A; }
.start:active { transform: translateY(4px); box-shadow: 0 2px 0 #231A36; }
.primary {
  background: var(--ink); color: var(--bg); border: 0; border-radius: 14px;
  padding: 18px; font-size: 19px; font-weight: 700; width: 100%;
}
.ghost { background: transparent; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 15px; }

/* 문항 */
.bar { display: flex; align-items: center; gap: 12px; }
.bar .track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink); transition: width .25s; }
.bar .count { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--muted); }
.back { background: none; border: 0; padding: 4px 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.back[disabled] { visibility: hidden; }
.bonus-tag { align-self: flex-start; background: var(--mark); color: var(--on-mark); font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 6px; }
.pre { font-size: 18px; font-weight: 600; text-wrap: balance; min-height: 1.55em; }
.duel { position: relative; display: flex; flex-direction: column; gap: 14px; }
.opt {
  position: relative; overflow: hidden; text-align: left;
  background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
  min-height: 132px; padding: 22px 20px; width: 100%;
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
  font-size: 21px; font-weight: 700; line-height: 1.35;
}
.opt::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 0;
  background: color-mix(in srgb, var(--mark) 38%, var(--card));
  transition: width .5s ease-out;
}
.opt > * { position: relative; }
.opt .pct { display: none; font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.duel.shown .opt::before { width: var(--pct); }
.duel.shown .opt .pct { display: block; }
.duel.shown .opt:not(.picked) { border-color: var(--line); }
.duel.shown .opt.picked { box-shadow: 5px 5px 0 var(--ink); }
.vs {
  position: absolute; left: 50%; top: 50%; z-index: 2;
  width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--bg); color: var(--stamp); border: 3px solid var(--stamp);
  font-family: var(--display); font-size: 20px; transform: rotate(-12deg);
}

/* 결과: 사원증 */
.badge { background: var(--card); border: 2px solid var(--ink); border-radius: 20px; overflow: hidden; position: relative; }
.badge-top { background: var(--ink); color: var(--bg); padding: 12px 20px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
.badge-body { padding: 24px 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.badge h2 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 10.5vw, 46px); line-height: 1.1; text-wrap: balance; padding-right: 64px; }
.code { font-weight: 700; letter-spacing: .3em; color: var(--muted); font-size: 15px; }
.tagline { font-size: 18px; font-weight: 600; }
.done {
  position: absolute; right: 14px; top: 58px; width: 74px; height: 74px; border-radius: 50%;
  border: 3px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center;
  font-family: var(--display); font-size: 16px; line-height: 1.1; transform: rotate(14deg); opacity: .9;
}
.section { display: flex; flex-direction: column; gap: 12px; }
.section h3 { margin: 0; font-size: 17px; font-weight: 700; }
.axis { display: flex; flex-direction: column; gap: 5px; }
.axis-head { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-weight: 600; }
.axis-head b { color: var(--ink); }
.meter { height: 12px; border-radius: 6px; background: var(--line); position: relative; }
.meter i { position: absolute; top: 0; bottom: 0; background: var(--ink); border-radius: 6px; }
.meter i.l { right: 50%; } .meter i.r { left: 50%; }
.meter::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--card); }
.axis p { font-size: 14px; }
.bonus-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bonus-list li { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.bonus-list span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; white-space: nowrap; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions > * { flex: 1 1 160px; }
#copy-out { width: 100%; min-height: 90px; font: inherit; font-size: 14px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .opt::before, .bar .fill { transition: none; } }
</style>
</head>
<body>

<main id="app"></main>

<script>
// 축: 첫 글자가 a 선택지 쪽
const AXES = {
  rel:  { name: "관계", a: ["W", "함께"], b: ["S", "혼자"],
          da: "사람들 사이에서 에너지를 얻고 일도 같이 풀어갑니다.", db: "혼자 집중할 때 가장 좋은 결과가 나옵니다." },
  exec: { name: "실행", a: ["P", "계획"], b: ["F", "유연"],
          da: "정해 둔 순서와 일정이 있어야 마음이 편합니다.", db: "상황이 바뀌면 방향도 바로 바꿉니다." },
  pay:  { name: "보상", a: ["M", "돈"], b: ["T", "시간"],
          da: "더 일하더라도 통장에 찍히는 숫자가 중요합니다.", db: "덜 받더라도 내 시간은 지킵니다." },
  perf: { name: "성과", a: ["R", "차등"], b: ["E", "균등"],
          da: "한 만큼 다르게 받아야 공정하다고 봅니다.", db: "같이 했으면 같이 나누는 게 맞다고 봅니다." }
};
const AXIS_ORDER = ["rel", "exec", "pay", "perf"];

const QUESTIONS = [
  { id: "r1", axis: "rel", a: "다양한 부서 사람들과 두루 지내기", b: "업무 연관된 소수와 깊게 지내기" },
  { id: "r2", axis: "rel", a: "시끌벅적한 사무실", b: "조용한 사무실" },
  { id: "r3", axis: "rel", a: "점심은 팀원들과 같이", b: "점심은 혼자 편하게" },
  { id: "p1", axis: "exec", pre: "프로젝트 중반, 기가 막힌 아이디어가 떠올랐다", a: "처음 세운 계획대로 간다", b: "바로 반영해서 계획을 바꾼다" },
  { id: "p2", axis: "exec", a: "매주 월요일 9시 정기보고", b: "이슈 있을 때마다 수시보고" },
  { id: "p3", axis: "exec", a: "매뉴얼이 잘 갖춰진 일", b: "정답 없이 내가 길을 만드는 일" },
  { id: "m1", axis: "pay", a: "근무시간 늘리고 월급 더 받기", b: "근무시간 줄이고 월급 적게 받기" },
  { id: "m2", axis: "pay", a: "연봉 500만원 인상", b: "연차 10일 추가" },
  { id: "m3", axis: "pay", a: "야근 잦지만 연봉 1.3배", b: "칼퇴 보장에 평균 연봉" },
  { id: "e1", axis: "perf", pre: "프로젝트 성공으로 인센티브가 나온다", a: "기여도에 따라 다르게 받기", b: "똑같이 N분의 1" },
  { id: "e2", axis: "perf", a: "평가에 따라 매년 0~10% 연봉 인상", b: "평가와 상관없이 매년 3% 연봉 인상" },
  { id: "e3", axis: "perf", a: "일 잘하지만 까칠한 동료", b: "일은 못하지만 분위기 메이커" }
];
const BONUS = [
  { id: "b1", a: "1등 상금 200만원 걸린 토요일 단합대회", b: "안 받고 안 하기" },
  { id: "b2", a: "평가등급 전사 공개", b: "평가등급 비공개" },
  { id: "b3", a: "점심에도 업무 얘기하는 동료", b: "업무시간에도 실없는 얘기하는 동료" }
];

const TYPES = {
  WPMR: ["판 짜는 야심가", "사람도 계획도 내 편으로 만들고, 성과만큼 가져갑니다."],
  WPME: ["의리의 총무", "계획은 내가 짤 테니, 같이 벌어서 같이 나눕시다."],
  WPTR: ["칼퇴하는 에이스", "일정대로 끝내고 인정받되, 저녁은 내 것입니다."],
  WPTE: ["워라밸 수호대장", "모두가 제시간에 퇴근하는 팀을 설계합니다."],
  WFMR: ["발 넓은 승부사", "사람을 타고 기회를 잡고, 잡은 만큼 챙깁니다."],
  WFME: ["의리파 행동대장", "일단 같이 뛰고, 결과는 다 같이 나눕니다."],
  WFTR: ["즉흥형 스타플레이어", "분위기 타면 누구보다 빛나고, 쉴 땐 확실히 쉽니다."],
  WFTE: ["탕비실 인기인", "사람 좋고 여유 좋고, 회사가 동네 같아야 합니다."],
  SPMR: ["조용한 실적왕", "말없이 계획대로 해내고 숫자로 증명합니다."],
  SPME: ["믿음직한 정석파", "맡은 몫을 정확히 해내고 공은 나눕니다."],
  SPTR: ["효율의 달인", "정해진 시간 안에 최고 결과를 내고 퇴근합니다."],
  SPTE: ["고요한 루틴러", "예측 가능한 하루와 방해받지 않는 자리면 충분합니다."],
  SFMR: ["혼자서도 잘 버는 용병", "어디에 떨어뜨려도 혼자 해결하고 값을 받습니다."],
  SFME: ["조용한 만능 지원군", "티 내지 않고 빈틈을 메우는 사람입니다."],
  SFTR: ["자유로운 고수", "방식도 시간도 내 마음대로, 대신 결과로 말합니다."],
  SFTE: ["마이웨이 자유인", "경쟁도 간섭도 사양, 내 속도로 갑니다."]
};

const app = document.getElementById("app");
let S;

// 문항별 집계: 페이지를 열 때 한 번 받아오고, 문항당 MIN_VOTES건 이상 쌓인 문항만 비율을 보여준다.
const MIN_VOTES = 30;
let STATS = {};
fetch("/api/stats").then(r => r.ok ? r.json() : null).then(d => { if (d && d.counts) STATS = d.counts; }).catch(() => {});

// a 선택지의 비율(%). 집계가 없거나 응답 수가 모자라면 null.
function pctA(id) {
  const a = Number(STATS[id + ":a"]) || 0, b = Number(STATS[id + ":b"]) || 0;
  if (a + b < MIN_VOTES) return null;
  return Math.round((a / (a + b)) * 100);
}

function submitAnswers() {
  if (S.sent) return;
  S.sent = true;
  fetch("/api/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answers: S.answers })
  }).catch(() => {});
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function reset() {
  const order = shuffle(QUESTIONS).concat(BONUS);
  S = { order, flip: order.map(() => Math.random() < 0.5), idx: 0, answers: {}, timer: null };
}

function renderCover() {
  reset();
  app.innerHTML = `
    <section class="cover">
      <p class="eyebrow">둘 중 하나만 고르세요</p>
      <h1 class="sr-only">직장인 밸런스게임</h1>
      <img class="cover-img" src="/cover.jpg" width="1200" height="960" alt="직장인 밸런스게임. 15개의 질문으로 알아보는 나의 직장인 유형, 16가지 유형이 기다려요.">
      <button class="start" id="start-button">게임 시작</button>
      <p class="note">개인정보는 묻지 않습니다. 선택 결과는 문항별 비율 집계에만 쓰입니다.</p>
    </section>`;
  document.getElementById("start-button").onclick = renderQuestion;
}

function renderQuestion() {
  clearTimeout(S.timer);
  if (S.idx >= S.order.length) return renderResult();
  const q = S.order[S.idx];
  const sides = S.flip[S.idx] ? ["b", "a"] : ["a", "b"];
  const isBonus = !q.axis;
  const pa = pctA(q.id);
  const pct = k => (k === "a" ? pa : 100 - pa);
  app.innerHTML = `
    <div class="bar">
      <div class="track"><div class="fill" style="width:${(S.idx / S.order.length) * 100}%"></div></div>
      <span class="count">${S.idx + 1} / ${S.order.length}</span>
    </div>
    ${isBonus ? `<span class="bonus-tag">보너스 라운드 · 유형에 반영되지 않아요</span>` : ""}
    <p class="pre">${q.pre || "당신의 선택은?"}</p>
    <div class="duel" id="duel">
      ${sides.map((k, i) => `
        <button class="opt" id="option${i + 1}" data-k="${k}" style="--pct:${pa === null ? 0 : pct(k)}%">
          <span>${q[k]}</span>
          ${pa === null ? "" : `<span class="pct">${pct(k)}%가 선택</span>`}
        </button>`).join("")}
      <span class="vs" aria-hidden="true">VS</span>
    </div>
    <button class="back" id="back-button" ${S.idx === 0 ? "disabled" : ""}>← 이전 문항</button>`;
  const duel = document.getElementById("duel");
  duel.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => {
      if (duel.classList.contains("shown")) return next();
      S.answers[q.id] = btn.dataset.k;
      btn.classList.add("picked");
      duel.classList.add("shown");
      S.timer = setTimeout(next, pa === null ? 450 : 1300);
    };
  });
  document.getElementById("back-button").onclick = () => {
    clearTimeout(S.timer);
    delete S.answers[q.id];
    S.idx--;
    delete S.answers[S.order[S.idx].id];
    renderQuestion();
  };
}

function next() {
  clearTimeout(S.timer);
  S.idx++;
  renderQuestion();
}

function score(answers) {
  const out = {};
  for (const ax of AXIS_ORDER) {
    const qs = QUESTIONS.filter(q => q.axis === ax);
    const nA = qs.filter(q => answers[q.id] === "a").length;
    const side = nA * 2 > qs.length ? "a" : "b";
    const n = side === "a" ? nA : qs.length - nA;
    out[ax] = { side, n, total: qs.length, minority: qs.filter(q => answers[q.id] !== side) };
  }
  return out;
}

function renderResult() {
  submitAnswers();
  const sc = score(S.answers);
  const code = AXIS_ORDER.map(ax => AXES[ax][sc[ax].side][0]).join("");
  const [name, tagline] = TYPES[code];
  const axesHtml = AXIS_ORDER.map(ax => {
    const A = AXES[ax], r = sc[ax];
    const w = (r.n / r.total) * 50;
    return `<div class="axis">
      <div class="axis-head">
        <span>${r.side === "a" ? `<b>${A.a[1]}</b>` : A.a[1]}</span>
        <span>${A.name} · ${r.n}:${r.total - r.n}</span>
        <span>${r.side === "b" ? `<b>${A.b[1]}</b>` : A.b[1]}</span>
      </div>
      <div class="meter"><i class="${r.side === "a" ? "l" : "r"}" style="width:${w}%"></i></div>
      <p>${r.side === "a" ? A.da : A.db}</p>
    </div>`;
  }).join("");
  const bonusHtml = BONUS.map(q => {
    const k = S.answers[q.id], pa = pctA(q.id);
    return `<li><span>${q[k]}</span><span>${pa === null ? "" : (k === "a" ? pa : 100 - pa) + "%와 같은 선택"}</span></li>`;
  }).join("");
  const shareText = `나의 직장인 유형은 「${name}」 (${code})\n${tagline}\n` +
    AXIS_ORDER.map(ax => `${AXES[ax].name}: ${AXES[ax][sc[ax].side][1]} ${sc[ax].n}:${sc[ax].total - sc[ax].n}`).join(" / ");

  app.innerHTML = `
    <article class="badge">
      <div class="badge-top"><span>직장인 유형 확인증</span><span>${code}</span></div>
      <div class="badge-body">
        <p class="code">${code.split("").join(" ")}</p>
        <h2>${name}</h2>
        <p class="tagline">${tagline}</p>
      </div>
      <span class="done" aria-hidden="true">분석<br>완료</span>
    </article>
    <section class="section"><h3>네 가지 축</h3>${axesHtml}</section>
    <section class="section">
      <h3>보너스 라운드</h3>
      <ul class="bonus-list">${bonusHtml}</ul>
    </section>
    <div class="actions">
      <button class="primary" id="copy-button">결과 복사하기</button>
      <button class="ghost" id="restart-button">다시 하기</button>
    </div>
    <textarea id="copy-out" hidden readonly></textarea>`;
  document.getElementById("restart-button").onclick = renderCover;
  const copyBtn = document.getElementById("copy-button");
  copyBtn.onclick = () => {
    const fallback = () => {
      const ta = document.getElementById("copy-out");
      ta.value = shareText; ta.hidden = false; ta.select();
      copyBtn.textContent = "아래 글을 복사하세요";
    };
    try {
      navigator.clipboard.writeText(shareText).then(() => { copyBtn.textContent = "복사했습니다"; }, fallback);
    } catch (e) { fallback(); }
  };
}

renderCover();
</script>
</body>
</html>
